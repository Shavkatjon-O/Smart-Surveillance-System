[project]
name = "smart-surveillance-backend"
version = "0.1.0"
description = "Camera registry, live view, PTZ control, events and analytics API of Smart Surveillance System"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16",
    "camera-adapters",
    "asyncpg>=0.30",
    "bcrypt>=4.3",
    "cryptography>=45.0",
    "event-bus",
    "fastapi>=0.120",
    "httpx>=0.28",
    "numpy>=2.3",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "pyjwt>=2.10",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0.41",
    "uvicorn[standard]>=0.35",
]

[dependency-groups]
dev = [
    "import-linter>=2.3",
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "ruff>=0.12",
]

[tool.uv]
package = false

[tool.uv.sources]
camera-adapters = { workspace = true }
event-bus = { workspace = true }

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["app", "camera_adapters", "tests"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/**" = ["D"]
"migrations/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.importlinter]
root_packages = ["app", "camera_adapters"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core and auth import no domain"
type = "forbidden"
source_modules = ["app.core", "app.auth"]
forbidden_modules = ["app.modules", "app.api", "app.main"]

[[tool.importlinter.contracts]]
name = "nothing in the product imports the development kit"
type = "forbidden"
source_modules = ["app.core", "app.auth", "app.api", "app.main", "app.modules", "app.streaming", "app.analytics", "app.health", "app.onvif"]
forbidden_modules = ["app.devkit"]

[[tool.importlinter.contracts]]
name = "packages import nothing from services or apps"
type = "forbidden"
source_modules = ["camera_adapters"]
forbidden_modules = ["app"]

[[tool.importlinter.contracts]]
name = "routers leave the database to services"
type = "forbidden"
source_modules = ["app.modules.alerting.routers", "app.modules.billing.routers", "app.modules.analytics.routers", "app.modules.devices.routers", "app.modules.events.routers", "app.modules.identity.routers", "app.modules.insights.routers", "app.modules.investigation.routers", "app.modules.media.routers", "app.modules.operations.routers", "app.modules.tenancy.routers", "app.modules.tv.routers"]
forbidden_modules = ["sqlalchemy", "app.core.database"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "alerting reaches other domains only through their services, schemas and deps"
type = "forbidden"
source_modules = ["app.modules.alerting"]
forbidden_modules = ["app.modules.billing.models", "app.modules.billing.routers", "app.modules.analytics.models", "app.modules.devices.models", "app.modules.events.models", "app.modules.identity.models", "app.modules.insights.models", "app.modules.investigation.models", "app.modules.operations.models", "app.modules.tenancy.models", "app.modules.tv.models", "app.modules.analytics.routers", "app.modules.devices.routers", "app.modules.events.routers", "app.modules.identity.routers", "app.modules.insights.routers", "app.modules.investigation.routers", "app.modules.media.routers", "app.modules.operations.routers", "app.modules.tenancy.routers", "app.modules.tv.routers"]
allow_indirect_imports = true

