name: compose

on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - "tools/devkit/**"
      - ".github/workflows/compose.yml"
  pull_request:
    paths:
      - "deploy/**"
      - "tools/devkit/**"
      - ".github/workflows/compose.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SSS_TV_RTSP_PASSWORD: example
  SSS_DEV_CAMERA_PASSWORD: example
  SSS_SECRETS_DIR: /run/secrets

jobs:
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Provide each target's env file from its example
        run: for target in deploy/*/; do cp "$target.env.example" "$target.env"; done
      - name: Validate every target alone, with each profile and with all its profiles
        run: |
          status=0
          for compose in deploy/*/docker-compose.yml; do
            profiles=$(docker compose -f "$compose" config --profiles)
            set -- ""
            for profile in $profiles; do set -- "$@" "--profile $profile"; done
            if [ "$(echo $profiles | wc -w)" -gt 1 ]; then set -- "$@" "$(printf -- '--profile %s ' $profiles)"; fi
            for flags in "$@"; do
              echo "== $compose $flags"
              docker compose -f "$compose" $flags config -q || status=1
            done
          done
          exit $status
