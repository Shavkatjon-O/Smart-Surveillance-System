log:
  level: info

api:
  listen: ":1984"

rtsp:
  listen: ":8554"
  username: "${SSS_TV_RTSP_USERNAME}"
  password: "${SSS_TV_RTSP_PASSWORD}"

webrtc:
  listen: ":8555"
  candidates:
    - "${SSS_LAN_BIND}:8555"

ffmpeg:
  h264: "-codec:v h264_nvenc -g:v 30 -bf:v 0 -profile:v high -preset:v p2 -tune:v ll -pix_fmt:v yuv420p"

streams:
  tv_wall: exec:sh /config/tv.sh tv_wall {output}
  tv_tile_0: exec:sh /config/tv.sh tv_tile_0 {output}
  tv_tile_1: exec:sh /config/tv.sh tv_tile_1 {output}
  tv_tile_2: exec:sh /config/tv.sh tv_tile_2 {output}
  tv_tile_3: exec:sh /config/tv.sh tv_tile_3 {output}
  tv_tile_4: exec:sh /config/tv.sh tv_tile_4 {output}
  tv_tile_5: exec:sh /config/tv.sh tv_tile_5 {output}
  tv_tile_6: exec:sh /config/tv.sh tv_tile_6 {output}
  tv_tile_7: exec:sh /config/tv.sh tv_tile_7 {output}
  tv_tile_8: exec:sh /config/tv.sh tv_tile_8 {output}
