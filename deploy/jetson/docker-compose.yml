name: smart-surveillance-system

services:
  postgres:
    extends:
      file: ../server/docker-compose.yml
      service: postgres

  nats:
    extends:
      file: ../server/docker-compose.yml
      service: nats

  go2rtc:
    extends:
      file: ../server/docker-compose.yml
      service: go2rtc
    image: alexxit/go2rtc:1.9.14
    deploy: !reset {}
    volumes: !override
      - ./go2rtc.yaml:/config/go2rtc.yaml:ro
      - ../server/go2rtc/go2rtc-tv.sh:/config/tv.sh:ro

  backend:
    extends:
      file: ../server/docker-compose.yml
      service: backend
    env_file: !override
      - .env

  event-store:
    extends:
      file: ../server/docker-compose.yml
      service: event-store
    env_file: !override
      - .env

  notifier:
    extends:
      file: ../server/docker-compose.yml
      service: notifier
    env_file: !override
      - .env

  metering:
    extends:
      file: ../server/docker-compose.yml
      service: metering
    env_file: !override
      - .env

  analytics:
    extends:
      file: ../server/docker-compose.yml
      service: analytics
    runtime: nvidia
    env_file: !override
      - .env
    environment:
      SSS_ANALYTICS_BACKEND_URL: http://backend:8000

      SSS_NATS_URL: ${SSS_NATS_URL:-nats://nats:4222}

      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video

      SSS_ANALYTICS_DETECTOR: rfdetr-nano
      SSS_ANALYTICS_ENGINE_BATCH: "6"
      SSS_ANALYTICS_WORKSPACE_MB: "512"

      SSS_ANALYTICS_PLATES: "false"

      SSS_ANALYTICS_FPS: "4"

      SSS_ANALYTICS_CLIP_ENCODER: libx264
      SSS_ANALYTICS_BUFFER_SECONDS: "60"
    deploy: !override
      resources:
        limits:
          memory: 3g
    volumes: !override
      - ${SSS_ANALYTICS_MODELS_DIR:-../../services/analytics/models}:/models:ro
      - analytics-engines:/engines
      - events:/data/events
      - type: tmpfs
        target: /buffer
        tmpfs:
          size: 536870912
          mode: 01777

  v380-ptz-1:
    extends:
      file: ../server/docker-compose.yml
      service: v380-ptz-1

  v380-ptz-2:
    extends:
      file: ../server/docker-compose.yml
      service: v380-ptz-2

  v380-relay-ptz-1:
    extends:
      file: ../server/docker-compose.yml
      service: v380-relay-ptz-1

  v380-relay-ptz-2:
    extends:
      file: ../server/docker-compose.yml
      service: v380-relay-ptz-2

  web:
    extends:
      file: ../server/docker-compose.yml
      service: web

volumes:
  postgres:
  events:
  analytics-engines:
  nats:

networks:
  cams:
  database:
    internal: true
  bus:
    internal: true
